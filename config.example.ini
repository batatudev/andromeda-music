# config.example.ini
[Servers]
active_server_id = demo

[Server_demo]
name = Navidrome Public Demo
url = https://demo.navidrome.org
username = demo
password = demo

[Theme]
theme_mode = dark
language = en
accent = #aa00ff
volume = 80
dev_mode = False

[Video]
resolution = 1080p
min_resolution = 480p
