dynamic_opacity = 20
dynamic_blur = 40
static_opacity = 50
static_blur = 75

[VideoOffline]
quality = 1080p
fps = 60
smart_auto_play = False
auto_dl_favs = False
auto_dl_playlists =

[AudioOffline]
stream_quality = raw
auto_dl_favs = False
auto_dl_playlists =
hide_undownloaded_offline = False