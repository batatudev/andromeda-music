name: Bug Report
description: Create a report to help us improve Andromeda Music
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
        Please check existing issues to avoid duplicates before submitting.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Start Andromeda Music
        2. Play track X
        3. Switch to video view
        4. See error
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: System & Diagnostic Information (Required)
      description: |
        Please run the following command in your terminal and paste the entire output block below:
        `andromeda-music --diagnostics` (or `python3 main.py --diagnostics`)
      placeholder: |
        Paste the entire ```yaml ... ``` output block generated by `andromeda-music --diagnostics` here.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Terminal Output / Error Logs (Optional)
      description: Paste any additional crash traces or logs from ~/.local/share/andromeda-music/logs/.
      render: shell
    validations:
      required: false