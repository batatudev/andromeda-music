name: Feature Request
description: Suggest an idea or enhancement for Andromeda Music
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Andromeda Music even better? Let us know!

  - type: textarea
    id: feature
    attributes:
      label: Proposed Feature
      description: Clear explanation of the feature you would like to see.
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use Case & Motivation
      description: Why would this feature be useful for users?
    validations:
      required: true